<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Smart Notes AI</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f7fb;
}

.card{
    width:420px;
    background:white;
    padding:40px;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.1);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    color:#172554;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:12px;
    border-radius:8px;
    margin-bottom:18px;
    text-align:center;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    margin-bottom:18px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:15px;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:9px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.register{
    text-align:center;
    margin-top:20px;
    color:#6b7280;
}

.register a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#2563eb;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
Smart Notes AI
</div>

<div class="subtitle">
Login to your study account
</div>

{% if error %}
<div class="error">
{{ error }}
</div>
{% endif %}

<form method="POST" action="/login">

<label>
Username or Email
</label>

<input
type="text"
name="username"
placeholder="Enter username or email"
required
>

<label>
Password
</label>

<input
type="password"
name="password"
placeholder="Enter password"
required
>

<button type="submit">
Login
</button>

</form>

<div class="register">
Don't have an account?
<a href="/register">
Create Account
</a>
</div>

<a href="/" class="back">
← Back to Home
</a>

</div>

</body>
</html>
