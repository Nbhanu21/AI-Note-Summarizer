<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - Smart Notes AI</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#f5f7fb;
    color:#172554;
}

.navbar{
    background:#172554;
    color:white;
    padding:18px 35px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo a{
    color:white;
    text-decoration:none;
}

.nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
}

.nav a:hover{
    text-decoration:underline;
}

.container{
    max-width:900px;
    margin:50px auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:40px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.profile-header{
    text-align:center;
    margin-bottom:35px;
}

.avatar{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:#dbeafe;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
}

.profile-header h1{
    margin-bottom:8px;
}

.profile-header p{
    color:#64748b;
}

.info{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.item{
    background:#f8fafc;
    padding:20px;
    border-radius:12px;
}

.item strong{
    display:block;
    color:#64748b;
    margin-bottom:8px;
}

.item span{
    font-size:17px;
    font-weight:bold;
}

.actions{
    margin-top:30px;
    display:flex;
    gap:15px;
}

.btn{
    padding:13px 22px;
    border-radius:9px;
    text-decoration:none;
    font-weight:bold;
}

.dashboard{
    background:#2563eb;
    color:white;
}

.logout{
    background:#fee2e2;
    color:#991b1b;
}

@media(max-width:650px){
    .navbar{
        flex-direction:column;
        gap:15px;
    }

    .nav a{
        margin:0 7px;
    }

    .info{
        grid-template-columns:1fr;
    }

    .actions{
        flex-direction:column;
    }
}
</style>

</head>

<body>

<div class="navbar">

    <div class="logo">
        <a href="/">
            Smart Notes AI
        </a>
    </div>

    <div class="nav">

        <a href="/summarizer">
            Summarizer
        </a>

        <a href="/quiz">
            Quiz Generator
        </a>

        <a href="/dashboard">
            Dashboard
        </a>

        <a href="/history">
            History
        </a>

        <a href="/logout">
            Logout
        </a>

    </div>

</div>


<div class="container">

    <div class="card">

        <div class="profile-header">

            <div class="avatar">
                👤
            </div>

            <h1>
                {{ user["username"] }}
            </h1>

            <p>
                Smart Notes AI Student Profile
            </p>

        </div>


        <div class="info">

            <div class="item">

                <strong>
                    Username
                </strong>

                <span>
                    {{ user["username"] }}
                </span>

            </div>


            <div class="item">

                <strong>
                    Email
                </strong>

                <span>
                    {{ user["email"] }}
                </span>

            </div>


            <div class="item">

                <strong>
                    Account Created
                </strong>

                <span>
                    {{ user["created_at"] }}
                </span>

            </div>


            <div class="item">

                <strong>
                    Account Status
                </strong>

                <span>
                    Active ✓
                </span>

            </div>

        </div>


        <div class="actions">

            <a
                class="btn dashboard"
                href="/dashboard"
            >
                ← Dashboard
            </a>

            <a
                class="btn logout"
                href="/logout"
            >
                Logout
            </a>

        </div>

    </div>

</div>

</body>
</html>
